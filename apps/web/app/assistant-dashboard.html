<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 助教工作台</title>
    <link rel="icon" type="image/png" href="/app/logo.png" />
    <link rel="stylesheet" href="./styles/theme.css?v=20260603c" />
</head>

<body class="app-shell assistant-shell academic-shell">
    <aside class="sidebar">
        <div class="sidebar-brand" aria-label="Linksee">
            <span class="sidebar-brand-mark" aria-hidden="true">L</span>
            <span class="sidebar-brand-text">Linksee</span>
        </div>
        <nav class="side-nav" aria-label="助教功能导航">
            <button class="nav-item is-active" data-target="panel-review" type="button" title="批阅">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 21h16"></path>
                        <path d="M7 17V9"></path>
                        <path d="M12 17V5"></path>
                        <path d="M17 17v-3"></path>
                    </svg>
                </span>
                <span class="nav-item-label">批阅</span>
            </button>
        </nav>
        <div class="sidebar-actions">
            <button id="userSettingsBtn" class="nav-item nav-item-ghost" data-action="open-settings" type="button" title="设置">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 20c1.8-3.6 5-5.4 8-5.4S18.2 16.4 20 20"></path>
                    </svg>
                </span>
                <span class="nav-item-label">设置</span>
            </button>
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button" title="退出登录">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 17l5-5-5-5"></path>
                        <path d="M20 12H9"></path>
                        <path d="M11 20H6a2 2 0 01-2-2V6a2 2 0 012-2h5"></path>
                    </svg>
                </span>
                <span class="nav-item-label">退出</span>
            </button>
        </div>
    </aside>

    <div class="workspace">
        <header class="topbar dashboard-topbar">
            <div class="topbar-left"></div>
            <div class="top-actions top-actions-staff">
                <div class="top-actions-primary" aria-label="快捷操作">
                    <button class="icon-btn" type="button" data-chat-launcher aria-label="消息">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 10h10"></path>
                            <path d="M7 14h6"></path>
                            <path d="M21 12c0 4.42-3.58 8-8 8a8.84 8.84 0 0 1-3.4-.67L3 21l1.67-6.6A8.84 8.84 0 0 1 4 11c0-4.42 3.58-8 8-8s9 4.58 9 9z"></path>
                        </svg>
                        <span class="linksee-chat-dot"></span>
                    </button>
                </div>
                <div class="user-profile user-profile-inline top-actions-profile">
                    <input type="file" id="avatarInput" accept="image/*" hidden />
                    <div class="avatar-wrapper topbar-avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                        <img class="topbar-avatar-image" id="avatarImage"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                            alt="用户头像" />
                        <div class="avatar-overlay">更换</div>
                    </div>
                    <div id="userBadge">ID: --</div>
                </div>
            </div>
        </header>

        <div class="content-container">
            <div class="page-panel is-active" id="panel-review">
                <section class="card assistant-review-workbench-card assistant-review-unified-card">
                    <div class="dashboard-toolbar-row assistant-review-toolbar">
                        <div class="dashboard-section-intro">
                            <h2 class="card-title dashboard-title-reset">批阅工作台</h2>
                        </div>
                        <div class="assistant-review-filter-grid">
                            <select class="dashboard-select" id="assistantCourseSelect">
                                <option value="">加载课程中...</option>
                            </select>
                            <select class="dashboard-select" id="assistantAssignmentSelect">
                                <option value="">选择项目</option>
                            </select>
                            <select class="dashboard-select" id="assistantStageSelect">
                                <option value="">全部阶段</option>
                            </select>
                            <button id="assistantReloadBtn" class="assistant-review-refresh-btn" type="button" aria-label="刷新" title="刷新">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M20 11a8 8 0 1 0 2.2 5.5"></path>
                                    <path d="M20 4v7h-7"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="dashboard-card-body">
                        <div class="assistant-review-workbench">
                            <section class="dashboard-subcard assistant-review-queue">
                                <div class="assistant-review-panel-head">
                                    <h3 class="dashboard-subcard-title">提交队列</h3>
                                    <div class="assistant-review-panel-metrics">
                                        <span id="assistantPendingCount">待批阅</span>
                                    </div>
                                </div>
                                <div class="list" id="assistantSubmissionList"></div>
                                <div class="assistant-review-queue-footer">
                                    <button id="assistantQueuePrev" class="assistant-review-page-btn" type="button" aria-label="上一页">‹</button>
                                    <span id="assistantQueuePage" class="assistant-review-page-indicator">1 / 1</span>
                                    <button id="assistantQueueNext" class="assistant-review-page-btn" type="button" aria-label="下一页">›</button>
                                    <span id="assistantQueueSize" class="assistant-review-page-size">6 组/页</span>
                                </div>
                            </section>

                            <section class="assistant-review-editor">
                                <div class="assistant-review-editor-top">
                                    <div class="dashboard-subcard assistant-review-selected-card">
                                        <div class="assistant-review-selected-head">
                                            <div>
                                                <strong id="assistantSelectedTitle">提交内容</strong>
                                                <div id="assistantSelectedPath" class="assistant-review-selected-path">课程 / 项目 / 阶段</div>
                                            </div>
                                            <button id="assistantReviewManageBtn" class="review-manage-icon-btn" type="button" aria-label="批阅管理" title="批阅管理">
                                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                                    <path d="M4 5h16"></path>
                                                    <path d="M4 12h10"></path>
                                                    <path d="M4 19h7"></path>
                                                    <circle cx="18" cy="17" r="3"></circle>
                                                    <path d="m20.2 19.2 1.8 1.8"></path>
                                                </svg>
                                            </button>
                                        </div>
                                        <div id="assistantReviewContext" class="assistant-review-inline-meta"></div>
                                    </div>

                                    <div class="dashboard-subcard assistant-review-detail-card">
                                        <h3 class="dashboard-subcard-title">提交内容</h3>
                                        <div id="assistantSubmissionDetail" class="assistant-review-detail-list">
                                            <div class="assistant-review-detail-layout">
                                                <div class="assistant-review-detail-main">
                                                    <div class="assistant-review-detail-item"><span class="assistant-review-detail-label">提交标题</span><div class="assistant-review-richtext"><span class="assistant-review-empty-text">暂无信息</span></div></div>
                                                    <div class="assistant-review-detail-item"><span class="assistant-review-detail-label">成果说明</span><div class="assistant-review-richtext"><span class="assistant-review-empty-text">暂无信息</span></div></div>
                                                    <div class="assistant-review-detail-item"><span class="assistant-review-detail-label">贡献说明</span><div class="assistant-review-richtext"><span class="assistant-review-empty-text">暂无信息</span></div></div>
                                                    <div class="assistant-review-detail-item"><span class="assistant-review-detail-label">仓库链接</span><div class="assistant-review-richtext"><span class="assistant-review-empty-text">暂无信息</span></div></div>
                                                    <div class="assistant-review-detail-item"><span class="assistant-review-detail-label">参考链接</span><div class="assistant-review-richtext"><span class="assistant-review-empty-text">暂无信息</span></div></div>
                                                </div>
                                                <aside class="assistant-review-file-card">
                                                    <div class="assistant-review-file-head"><span>附件列表</span><span>暂无附件</span></div>
                                                    <div class="assistant-review-file-list">
                                                        <div class="assistant-review-file-empty">文件类型：<span class="assistant-review-empty-text">暂无信息</span><br>文件名：<span class="assistant-review-empty-text">暂无信息</span></div>
                                                    </div>
                                                </aside>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div id="assistantReviewManageModal" class="review-manage-modal" hidden>
                                    <div class="review-manage-backdrop" data-review-manage-close></div>
                                    <section class="review-manage-dialog" role="dialog" aria-modal="true" aria-labelledby="assistantReviewManageTitle">
                                        <div class="review-manage-head">
                                            <div>
                                                <h3 id="assistantReviewManageTitle">批阅管理</h3>
                                                <span>按课程、阶段、小组和状态筛选提交记录</span>
                                            </div>
                                            <button class="review-manage-close" type="button" data-review-manage-close aria-label="关闭">×</button>
                                        </div>
                                        <div class="review-manage-filters">
                                            <input id="assistantReviewManageKeyword" class="dashboard-input" type="search" placeholder="搜索小组 / 组长">
                                            <select id="assistantReviewManageStatus" class="dashboard-select">
                                                <option value="">全部状态</option>
                                                <option value="submitted">待批阅</option>
                                                <option value="under_review">待评分</option>
                                                <option value="approved">已通过</option>
                                                <option value="needs_changes">待修改</option>
                                                <option value="rejected">已拒绝</option>
                                            </select>
                                            <select id="assistantReviewManageStage" class="dashboard-select">
                                                <option value="">当前阶段范围</option>
                                            </select>
                                        </div>
                                        <div class="review-manage-body">
                                            <section class="review-manage-table-card">
                                                <div id="assistantReviewManageRows" class="review-manage-table"></div>
                                            </section>
                                            <div class="dashboard-inline-grid assistant-review-lower-grid review-manage-side">
                                    <div class="dashboard-subcard assistant-review-action-card">
                                        <h3 class="dashboard-subcard-title">批阅</h3>
                                        <label class="user-settings-field">
                                            <span>结论</span>
                                            <select id="assistantReviewStatus" class="dashboard-select">
                                                <option value="approved">通过</option>
                                                <option value="needs_changes">退回修改</option>
                                                <option value="rejected">拒绝</option>
                                            </select>
                                        </label>
                                        <label class="user-settings-field">
                                            <span>批阅意见</span>
                                            <textarea id="assistantCommentInput" class="dashboard-textarea" placeholder="输入批阅意见"></textarea>
                                        </label>
                                        <div class="dashboard-panel-actions assistant-review-action-row">
                                            <button id="assistantStartBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>开始评审</button>
                                            <button id="assistantReviewSaveBtn" class="btn btn-primary academic-btn-block" type="button" disabled>提交批阅</button>
                                        </div>
                                    </div>

                                    <div class="dashboard-subcard assistant-review-history-card">
                                        <div class="assistant-review-panel-head">
                                            <h3 class="dashboard-subcard-title">历次提交</h3>
                                            <span class="dashboard-filter-tag" id="assistantAttemptCount">0 次</span>
                                        </div>
                                        <div id="assistantAttemptList" class="assistant-review-attempt-list">
                                            <div class="assistant-review-placeholder">暂无记录</div>
                                        </div>
                                    </div>
                                            </div>
                                        </div>
                                    </section>
                                </div>

                                <div class="dashboard-empty-state" id="assistantActionResult" hidden></div>
                            </section>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./scripts/api-client.js?v=20260602b"></script>
    <script src="./scripts/page-utils.js?v=20260602b"></script>
    <script src="./scripts/dashboard-shell.js?v=20260603w"></script>
    <script src="./scripts/user-settings.js?v=20260602b"></script>
    <script src="./scripts/leaf-pile.js?v=20260602b"></script>
    <script src="./scripts/assistant-dashboard.js?v=20260618b"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        initDashboardShell({ avatarStorageKey: "assistant_avatar_data_url" });
        if (typeof initAssistantDashboard === "function") {
            initAssistantDashboard();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 助教工作台</title>
    <link rel="stylesheet" href="./styles/theme.css?v=20260602c" />
</head>

<body class="app-shell assistant-shell academic-shell">
    <aside class="sidebar">
        <div class="sidebar-brand" aria-label="Linksee">
            <span class="sidebar-brand-mark" aria-hidden="true">L</span>
            <span class="sidebar-brand-text">Linksee</span>
        </div>
        <nav class="side-nav" aria-label="助教功能导航">
            <button class="nav-item is-active" data-target="panel-review" type="button" title="检查">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                </span>
                <span class="nav-item-label">检查</span>
            </button>
            <button class="nav-item" data-target="panel-history" type="button" title="记录">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"></path><path d="M3.1 13a9 9 0 1 0 2.1-5.7L3 8"></path><path d="M12 7v5l3 2"></path></svg>
                </span>
                <span class="nav-item-label">记录</span>
            </button>
            <button class="nav-item" data-target="panel-courses" type="button" title="课程">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l9-4 9 4-9 4-9-4z"></path><path d="M21 10.5v7l-9 4-9-4v-7"></path><path d="M12 10.5v11"></path></svg>
                </span>
                <span class="nav-item-label">课程</span>
            </button>
        </nav>
        <div class="sidebar-actions">
            <button id="userSettingsBtn" class="nav-item nav-item-ghost" data-action="open-settings" type="button" title="设置">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.8-3.6 5-5.4 8-5.4S18.2 16.4 20 20"></path></svg>
                </span>
                <span class="nav-item-label">设置</span>
            </button>
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button" title="退出登录">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"></path><path d="M20 12H9"></path><path d="M11 20H6a2 2 0 01-2-2V6a2 2 0 012-2h5"></path></svg>
                </span>
                <span class="nav-item-label">退出</span>
            </button>
        </div>
    </aside>

    <div class="workspace">
        <header class="topbar dashboard-topbar">
            <div class="topbar-left"></div>
            <div class="top-actions top-actions-staff">
                <div class="top-actions-primary" aria-label="快捷操作">
                    <button class="icon-btn" type="button" data-chat-launcher aria-label="消息">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 10h10"></path>
                            <path d="M7 14h6"></path>
                            <path d="M21 12c0 4.42-3.58 8-8 8a8.84 8.84 0 0 1-3.4-.67L3 21l1.67-6.6A8.84 8.84 0 0 1 4 11c0-4.42 3.58-8 8-8s9 4.58 9 9z"></path>
                        </svg>
                        <span class="linksee-chat-dot"></span>
                    </button>
                </div>
                <div class="user-profile user-profile-inline top-actions-profile">
                    <input type="file" id="avatarInput" accept="image/*" hidden />
                    <div class="avatar-wrapper topbar-avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                        <img class="topbar-avatar-image" id="avatarImage"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                            alt="用户头像" />
                        <div class="avatar-overlay">更换</div>
                    </div>
                    <div id="userBadge">ID: --</div>
                </div>
            </div>
        </header>
        <div class="content-container">
            <div class="page-panel is-active" id="panel-review">
                <section class="card assistant-review-workbench-card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">检查工作台</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="meta" id="metaInfo">正在加载登录信息...</div>
                        <div class="dashboard-inline-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">工作概览</h3>
                                <div class="stat-grid">
                                    <div class="stat"><strong id="assistantCourseCount">0</strong><span>绑定课程</span></div>
                                    <div class="stat"><strong id="assistantNeedCheckCount">0</strong><span>待检查提交</span></div>
                                </div>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">当前课程</h3>
                                <select class="dashboard-select" id="assistantCourseSelect"></select>
                            </div>
                        </div>

                        <div class="assistant-review-workbench">
                            <section class="dashboard-subcard assistant-review-queue">
                                <div class="dashboard-split-row">
                                    <h3 class="dashboard-subcard-title">待处理队列</h3>
                                    <button id="assistantReloadBtn" class="btn btn-secondary" type="button">刷新</button>
                                </div>
                                <div class="list dashboard-scroll-region" id="assistantSubmissionList"></div>
                                <div class="dashboard-empty-state" id="assistantSubmissionEmpty" hidden>
                                    <strong>暂无待检查提交</strong>
                                    <p>当前课程没有待处理提交。</p>
                                </div>
                                <div class="dashboard-filter-bar">
                                    <div class="dashboard-filter-meta">
                                        <span id="assistantPendingCount">当前待处理 0 条</span>
                                        <span class="dashboard-filter-tag" id="assistantReviewCount">评审中: 0</span>
                                        <span class="dashboard-filter-tag" id="assistantNewCount">新提交: 0</span>
                                    </div>
                                </div>
                            </section>

                            <section class="assistant-review-editor">
                                <div class="dashboard-subcard">
                                    <h3 class="dashboard-subcard-title">当前提交</h3>
                                    <div class="dashboard-empty-state" id="assistantReviewContext">请选择左侧提交</div>
                                    <label class="user-settings-field">
                                        <span>Submission ID</span>
                                        <input id="assistantSubmissionId" class="dashboard-input" />
                                    </label>
                                    <label class="user-settings-field">
                                        <span>Review ID</span>
                                        <input id="assistantReviewId" class="dashboard-input" />
                                    </label>
                                </div>

                                <div class="dashboard-inline-grid dashboard-split-scroll-grid">
                                    <div class="dashboard-subcard">
                                        <h3 class="dashboard-subcard-title">复核意见</h3>
                                        <label class="user-settings-field">
                                            <span>结论</span>
                                            <select id="assistantReviewStatus" class="dashboard-select">
                                                <option value="approved">通过</option>
                                                <option value="needs_changes">退回修改</option>
                                                <option value="rejected">拒绝</option>
                                            </select>
                                        </label>
                                        <label class="user-settings-field">
                                            <span>意见</span>
                                            <textarea id="assistantCommentInput" class="dashboard-textarea" placeholder="请输入复核意见"></textarea>
                                        </label>
                                    </div>

                                    <div class="dashboard-subcard">
                                        <h3 class="dashboard-subcard-title">成绩草稿</h3>
                                        <label class="user-settings-field">
                                            <span>分数 (0-100)</span>
                                            <input id="assistantScoreInput" class="dashboard-input" type="number" min="0" max="100" placeholder="输入分数" />
                                        </label>
                                        <div class="dashboard-panel-actions">
                                            <button id="assistantStartBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>开始检查</button>
                                            <button id="assistantReviewSaveBtn" class="btn btn-primary academic-btn-block" type="button" disabled>提交复核</button>
                                            <button id="assistantReviewUpdateBtn" class="btn btn-secondary academic-btn-block" type="button">更新复核</button>
                                            <button id="assistantDraftSaveBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>保存成绩草稿</button>
                                            <button id="assistantMarkReviewedBtn" class="btn btn-secondary academic-btn-block" type="button">标记已阅</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="dashboard-empty-state" id="assistantActionResult" hidden></div>
                            </section>
                        </div>
                    </div>
                </section>
            </div>

            <div class="page-panel" id="panel-history">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">处理记录</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-inline-grid dashboard-split-scroll-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">导出</h3>
                                <select id="assistantExportCourse" class="dashboard-select"></select>
                                <div class="dashboard-panel-actions">
                                    <button id="assistantExportReviews" class="btn btn-primary academic-btn-block" type="button">导出批改记录</button>
                                    <button id="assistantExportGrades" class="btn btn-secondary academic-btn-block" type="button">导出成绩</button>
                                </div>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">最近成绩记录</h3>
                                <div class="list dashboard-scroll-region" id="assistantHistoryList"></div>
                                <div class="dashboard-empty-state" id="assistantHistoryEmpty" hidden>
                                    <strong>暂无处理记录</strong>
                                    <p>保存成绩草稿或教师发布成绩后会显示在这里。</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="page-panel" id="panel-courses">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">负责课程</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="list dashboard-scroll-region" id="assistantCourseList"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./scripts/api-client.js?v=20260602b"></script>
    <script src="./scripts/page-utils.js?v=20260602b"></script>
    <script src="./scripts/dashboard-shell.js?v=20260602b"></script>
    <script src="./scripts/user-settings.js?v=20260602b"></script>
    <script src="./scripts/leaf-pile.js?v=20260602b"></script>
    <script src="./scripts/assistant-dashboard.js?v=20260602b"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        initDashboardShell({ avatarStorageKey: "assistant_avatar_data_url" });
        if (typeof initAssistantDashboard === "function") {
            initAssistantDashboard();
        }
    </script>
</body>

</html>

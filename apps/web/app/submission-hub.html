<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 提交台</title>
    <link rel="stylesheet" href="./styles/theme.css" />
</head>
<body>
<main class="page">
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>提交台</div>
        <div class="top-actions">
            <span id="userBadge" class="user-avatar">ID: --</span>
            <a class="icon-btn" href="./chat-hub.html" title="打开课程群聊">聊</a>
            <button id="backToDashboard" class="ghost">返回工作台</button>
            <button id="logoutBtn">退出登录</button>
        </div>
    </header>
    <section class="card">
        <h1 class="card-title">阶段提交入口</h1>
        <div class="meta" id="metaInfo">正在加载登录信息...</div>
        <div class="action-grid">
            <select id="courseSelect" class="dashboard-select"></select>
            <select id="assignmentSelect" class="dashboard-select"></select>
            <select id="groupSelect" class="dashboard-select"></select>
            <select id="stageSelect" class="dashboard-select"></select>
        </div>
        <input id="titleInput" class="dashboard-input" placeholder="提交标题" />
        <textarea id="descriptionInput" class="dashboard-textarea" placeholder="提交说明"></textarea>
        <input id="repoInput" class="dashboard-input" placeholder="仓库链接(可选)" />
        <div class="action-grid">
            <button id="submitBtn" class="btn">提交材料</button>
            <button id="saveDraftBtn" class="btn btn-ghost">保存草稿</button>
        </div>
        <div class="dashboard-empty-state" id="submissionResult" hidden></div>
    </section>
</main>
<script src="./scripts/api-client.js"></script>
<script src="./scripts/page-utils.js"></script>
<script src="./scripts/dashboard-shell.js"></script>
<script>
if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
const auth = linkseePage.getAuth();
linkseePage.setSessionMeta(document.getElementById("metaInfo"), document.getElementById("userBadge"));
document.getElementById("logoutBtn").onclick = linkseePage.logout;
document.getElementById("backToDashboard").onclick = () => linkseePage.go(linkseePage.roleDashboard(auth.role));
initDashboardShell({ avatarStorageKey: "submission_avatar_data_url" });
const courseSelect = document.getElementById("courseSelect");
const assignmentSelect = document.getElementById("assignmentSelect");
const groupSelect = document.getElementById("groupSelect");
const stageSelect = document.getElementById("stageSelect");
const result = document.getElementById("submissionResult");
let currentAssignmentId = "";
async function loadCourses() {
    const payload = await window.linkseeApi.getJson("/api/v1/courses");
    const rows = Array.isArray(payload.data) ? payload.data : [];
    courseSelect.innerHTML = rows.map((c) => `<option value="${c.id}">${linkseePage.escapeHtml(c.name || c.courseNo || c.id)}</option>`).join("");
    if (rows[0]) {
        courseSelect.value = rows[0].id;
        await loadAssignments(rows[0].id);
    }
}
async function loadAssignments(courseId) {
    const payload = await window.linkseeApi.getJson(`/api/v1/courses/${courseId}/assignments`);
    const rows = Array.isArray(payload.data) ? payload.data : [];
    assignmentSelect.innerHTML = rows.map((a) => `<option value="${a.id}">${linkseePage.escapeHtml(a.title || a.id)}</option>`).join("");
    if (rows[0]) {
        assignmentSelect.value = rows[0].id;
        currentAssignmentId = rows[0].id;
        await loadStagesAndGroup(rows[0].id);
    }
}
async function loadStagesAndGroup(assignmentId) {
    const [stagePayload, groupPayload] = await Promise.all([
        window.linkseeApi.getJson(`/api/v1/assignments/${assignmentId}/stages`),
        window.linkseeApi.getJson(`/api/v1/assignments/${assignmentId}/my-group`),
    ]);
    const stages = Array.isArray(stagePayload.data) ? stagePayload.data : [];
    const group = groupPayload.data || null;
    groupSelect.innerHTML = group ? `<option value="${group.group ? group.group.id : group.id}">${linkseePage.escapeHtml(group.group ? (group.group.name || `第 ${group.group.groupNo} 组`) : `第 ${group.groupNo} 组`)}</option>` : '<option value="">无小组</option>';
    stageSelect.innerHTML = stages.map((s) => `<option value="${s.id}">${linkseePage.escapeHtml(s.title || `阶段 ${s.stageNo}`)}</option>`).join("");
}
courseSelect.onchange = () => loadAssignments(courseSelect.value);
assignmentSelect.onchange = () => loadStagesAndGroup(assignmentSelect.value);
document.getElementById("submitBtn").onclick = async () => {
    if (!groupSelect.value || !stageSelect.value) return;
    const payload = {
        title: document.getElementById("titleInput").value.trim(),
        description: document.getElementById("descriptionInput").value.trim(),
        repositoryUrl: document.getElementById("repoInput").value.trim() || undefined,
    };
    const data = await window.linkseeApi.postJson(`/api/v1/stages/${stageSelect.value}/groups/${groupSelect.value}/submissions`, payload);
    result.hidden = false;
    result.innerHTML = '<strong>提交成功</strong><p>submissionId: ' + linkseePage.escapeHtml(data.data && data.data.id) + '</p>';
};
document.getElementById("saveDraftBtn").onclick = () => {
    result.hidden = false;
    result.innerHTML = "<strong>已保存草稿</strong><p>当前页面先保留本地草稿位。</p>";
};
loadCourses();
</script>
</body>
</html>

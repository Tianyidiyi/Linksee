<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 学生工作台</title>
    <link rel="stylesheet" href="./styles/theme.css?v=20260603c" />
</head>

<body class="app-shell student-shell">

    <aside class="sidebar">
        <div class="sidebar-brand" aria-label="Linksee">
            <span class="sidebar-brand-mark" aria-hidden="true">L</span>
            <span class="sidebar-brand-text">Linksee</span>
        </div>

        <nav class="side-nav" aria-label="学生功能导航">
            <button class="nav-item is-active" data-target="panel-courses" type="button" title="课程">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l9-4 9 4-9 4-9-4z"></path><path d="M21 10.5v7l-9 4-9-4v-7"></path><path d="M12 10.5v11"></path></svg>
                </span>
                <span class="nav-item-label">课程</span>
            </button>
            <button class="nav-item" data-target="panel-minitask-manage" type="button" title="组队">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="8.5" cy="7" r="3.2"></circle><path d="M24 21v-2a4 4 0 00-3-3.87"></path><path d="M17 3.2a3.2 3.2 0 010 6.2"></path></svg>
                </span>
                <span class="nav-item-label">组队</span>
            </button>
            <button class="nav-item" data-target="panel-file-submit" type="button" title="提交">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><path d="M14 2v6h6"></path><path d="M12 18v-6"></path><path d="M9.5 14.5L12 12l2.5 2.5"></path></svg>
                </span>
                <span class="nav-item-label">提交</span>
            </button>
            <button class="nav-item" data-target="panel-grades" type="button" title="成绩">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"></path><path d="M12 20V4"></path><path d="M6 20v-7"></path></svg>
                </span>
                <span class="nav-item-label">成绩</span>
            </button>
        </nav>
        <div class="sidebar-actions">
            <button id="userSettingsBtn" class="nav-item" data-action="open-settings" type="button" title="用户设置">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.8-3.6 5-5.4 8-5.4S18.2 16.4 20 20"></path></svg>
                </span>
                <span class="nav-item-label">设置</span>
            </button>
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button" title="退出登录">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"></path><path d="M20 12H9"></path><path d="M11 20H6a2 2 0 01-2-2V6a2 2 0 012-2h5"></path></svg>
                </span>
                <span class="nav-item-label">退出</span>
            </button>
        </div>
    </aside>

    <div class="workspace">
        <header class="topbar dashboard-topbar">
            <div class="topbar-left"></div>
            <div class="top-actions top-actions-staff top-actions-student">
                <div class="top-actions-primary" aria-label="快捷操作">
                    <button class="icon-btn" type="button" data-chat-launcher aria-label="消息">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 10h10"></path>
                            <path d="M7 14h6"></path>
                            <path d="M21 12c0 4.42-3.58 8-8 8a8.84 8.84 0 0 1-3.4-.67L3 21l1.67-6.6A8.84 8.84 0 0 1 4 11c0-4.42 3.58-8 8-8s9 4.58 9 9z"></path>
                        </svg>
                        <span class="linksee-chat-dot"></span>
                    </button>
                    <div class="student-todo-widget" id="studentTodoWidget">
                        <button class="student-todo-launcher icon-btn" id="studentTodoToggle" type="button" aria-label="待办事项" aria-expanded="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9 6h11" />
                                <path d="M9 12h11" />
                                <path d="M9 18h11" />
                                <path d="M4 6l1 1 2-2" />
                                <path d="M4 12l1 1 2-2" />
                                <path d="M4 18l1 1 2-2" />
                            </svg>
                            <span class="student-todo-count" id="studentTodoCountBadge" hidden>0</span>
                        </button>
                        <section class="student-todo-popover" id="studentTodoPopover" aria-label="待办事项" hidden>
                            <div class="student-todo-popover-head">
                                <strong>待办事项</strong>
                                <button class="student-todo-close" id="studentTodoClose" type="button">收起</button>
                            </div>
                            <div class="student-todo-list" id="studentTodoMemoList">
                                <div class="student-todo-empty"><strong>正在加载</strong><p>待办事项同步中。</p></div>
                            </div>
                        </section>
                    </div>
                </div>
                <div class="user-profile user-profile-inline top-actions-profile user-profile-inline-topbar">
                    <input type="file" id="avatarInput" accept="image/*" hidden />
                    <div class="avatar-wrapper topbar-avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                        <img class="topbar-avatar-image" id="avatarImage"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                            alt="用户头像" />
                    </div>
                </div>
            </div>
        </header>
        <div class="content-container">
            <div class="page-panel" id="panel-grades">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">最近成绩与反馈</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="list dashboard-scroll-region" id="studentGradeList"></div>
                        <div class="dashboard-empty-state" id="studentGradeEmpty" hidden>
                            <strong>暂无成绩记录</strong>
                            <p>当前还没有已发布到你所在小组的阶段成绩。</p>
                        </div>
                    </div>
                </section>
            </div>

            <div class="page-panel is-active" id="panel-courses">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">我的课程</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-subcard">
                            <div class="dashboard-split-row">
                                <h3 class="dashboard-subcard-title">课程列表</h3>
                                <div class="dashboard-filter-meta">
                                    <select class="dashboard-select" id="studentCourseScopeSelect">
                                        <option value="">全部课程</option>
                                    </select>
                                    <span class="badge badge-active">已加入 <strong id="studentCourseCount">0</strong></span>
                                </div>
                            </div>
                            <div class="list dashboard-scroll-region" id="studentCourseList"></div>
                        </div>
                        <div class="dashboard-inline-grid dashboard-split-scroll-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">项目阶段</h3>
                                <div class="list dashboard-scroll-region" id="studentStageList"></div>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">提交记录</h3>
                                <div class="list dashboard-scroll-region" id="studentArtifactList"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./scripts/api-client.js?v=20260602b"></script>
    <script src="./scripts/page-utils.js?v=20260602b"></script>
    <script src="./scripts/dashboard-extensions.js?v=20260602b"></script>
    <script src="./scripts/dashboard-shell.js?v=20260603w"></script>
    <script src="./scripts/user-settings.js?v=20260602b"></script>
    <script src="./scripts/leaf-pile.js?v=20260602b"></script>
    <script src="./scripts/student-dashboard.js?v=20260602b"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        initDashboardShell({
            avatarStorageKey: "student_avatar_data_url",
        });
        window.addEventListener("linksee:student-groups-changed", function () {
            window.location.reload();
        });
        if (typeof initStudentDashboard === "function") {
            initStudentDashboard();
        }
    </script>
</body>

</html>

<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 学生工作台</title>
    <link rel="stylesheet" href="./styles/theme.css" />
</head>

<body class="app-shell student-shell academic-shell">

    <div class="sidebar-trigger" aria-hidden="true"></div>
    <aside class="sidebar">
        <div class="user-profile">
            <input type="file" id="avatarInput" accept="image/*" hidden />
            <div class="avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                <img id="avatarImage"
                    src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                    alt="用户头像" />
                <div class="avatar-overlay">更换</div>
            </div>
            <div id="userBadge">ID: --</div>
        </div>

        <nav class="side-nav" aria-label="学生功能导航">
            <button class="nav-item is-active" data-target="panel-courses" type="button">我的课程</button>
            <button class="nav-item" data-target="panel-grades" type="button">成绩与反馈</button>
        </nav>
        <div class="sidebar-actions">
            <button id="userSettingsBtn" class="nav-item nav-item-ghost" type="button">用户设置</button>
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button">退出登录</button>
        </div>
    </aside>

    <div class="student-todo-widget" id="studentTodoWidget">
        <button class="student-todo-launcher" id="studentTodoToggle" type="button" aria-label="打开待办事项" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 6h11" />
                <path d="M9 12h11" />
                <path d="M9 18h11" />
                <path d="M4 6l1 1 2-2" />
                <path d="M4 12l1 1 2-2" />
                <path d="M4 18l1 1 2-2" />
            </svg>
            <span class="student-todo-count" id="studentTodoCountBadge" hidden>0</span>
        </button>
        <section class="student-todo-popover" id="studentTodoPopover" aria-label="待办事项" hidden>
            <div class="student-todo-popover-head">
                <strong>待办事项</strong>
                <button class="student-todo-close" id="studentTodoClose" type="button">收起</button>
            </div>
            <div class="student-todo-list" id="studentTodoMemoList">
                <div class="student-todo-empty"><strong>正在加载</strong><p>待办事项同步中。</p></div>
            </div>
        </section>
    </div>

    <div class="workspace">
        <div class="content-container">
            <div class="page-panel" id="panel-grades">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">最近成绩与反馈</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="list dashboard-scroll-region" id="studentGradeList"></div>
                        <div class="dashboard-empty-state" id="studentGradeEmpty" hidden>
                            <strong>暂无成绩记录</strong>
                            <p>当前还没有已发布到你所在小组的阶段成绩。</p>
                        </div>
                    </div>
                </section>
            </div>

            <div class="page-panel is-active" id="panel-courses">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">我的课程</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-subcard">
                            <div class="dashboard-split-row">
                                <h3 class="dashboard-subcard-title">课程列表</h3>
                                <div class="dashboard-filter-meta">
                                    <select class="dashboard-select" id="studentCourseScopeSelect">
                                        <option value="">全部课程</option>
                                    </select>
                                    <span class="badge badge-active">已加入 <strong id="studentCourseCount">0</strong></span>
                                </div>
                            </div>
                            <div class="list dashboard-scroll-region" id="studentCourseList"></div>
                        </div>
                        <div class="dashboard-inline-grid dashboard-split-scroll-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">项目阶段</h3>
                                <div class="list dashboard-scroll-region" id="studentStageList"></div>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">提交记录</h3>
                                <div class="list dashboard-scroll-region" id="studentArtifactList"></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./scripts/api-client.js"></script>
    <script src="./scripts/page-utils.js"></script>
    <script src="./scripts/dashboard-extensions.js"></script>
    <script src="./scripts/dashboard-shell.js"></script>
    <script src="./scripts/user-settings.js"></script>
    <script src="./scripts/leaf-pile.js"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        initDashboardShell({
            avatarStorageKey: "student_avatar_data_url",
        });
        window.addEventListener("linksee:student-groups-changed", function () {
            window.location.reload();
        });
        (async function () {
            if (!window.linkseeApi) return;
            var todoToggle = document.getElementById("studentTodoToggle");
            var todoClose = document.getElementById("studentTodoClose");
            var todoPopover = document.getElementById("studentTodoPopover");
            var todoMemoList = document.getElementById("studentTodoMemoList");
            var todoCountBadge = document.getElementById("studentTodoCountBadge");

            function toggleTodoPopover(forceOpen) {
                if (!todoPopover || !todoToggle) return;
                var shouldOpen = typeof forceOpen === "boolean" ? forceOpen : todoPopover.hidden;
                todoPopover.hidden = !shouldOpen;
                todoToggle.setAttribute("aria-expanded", shouldOpen ? "true" : "false");
            }

            if (todoToggle) {
                todoToggle.addEventListener("click", function (event) {
                    event.stopPropagation();
                    toggleTodoPopover();
                });
            }
            if (todoClose) {
                todoClose.addEventListener("click", function () {
                    toggleTodoPopover(false);
                });
            }
            document.addEventListener("click", function (event) {
                var widget = document.getElementById("studentTodoWidget");
                if (widget && !widget.contains(event.target)) {
                    toggleTodoPopover(false);
                }
            });

            function getTodoStatus(row) {
                return row.submission && row.submission.status ? row.submission.status : "not_submitted";
            }

            function isTodoDone(row) {
                var status = getTodoStatus(row);
                return status === "approved" || status === "reviewed";
            }

            try {
                var courses = await window.linkseeApi.getJson("/api/v1/courses");
                var courseRows = Array.isArray(courses.data) ? courses.data : [];
                var courseList = document.getElementById("studentCourseList");
                var courseScopeSelect = document.getElementById("studentCourseScopeSelect");
                var courseCount = document.getElementById("studentCourseCount");
                var stageList = document.getElementById("studentStageList");
                var artifactList = document.getElementById("studentArtifactList");
                var gradeList = document.getElementById("studentGradeList");
                var gradeEmpty = document.getElementById("studentGradeEmpty");
                if (courseCount) courseCount.textContent = String(courseRows.length);
                if (courseScopeSelect) {
                    courseScopeSelect.innerHTML = '<option value="">全部课程</option>' + courseRows.map(function (course) {
                        return '<option value="' + linkseePage.escapeHtml(course.id) + '">' + linkseePage.escapeHtml(course.name || course.courseNo || course.id) + '</option>';
                    }).join("");
                }
                var todoRows = [];
                var gradeRows = [];

                for (var i = 0; i < courseRows.length; i++) {
                    var course = courseRows[i];
                    var assignmentsPayload = await window.linkseeApi.getJson("/api/v1/courses/" + encodeURIComponent(course.id) + "/assignments").catch(function () {
                        return { data: [] };
                    });
                    var assignments = Array.isArray(assignmentsPayload.data) ? assignmentsPayload.data : [];
                    for (var j = 0; j < assignments.length; j++) {
                        var assignment = assignments[j];
                        var myGroupPayload = await window.linkseeApi.getJson("/api/v1/assignments/" + encodeURIComponent(assignment.id) + "/my-group").catch(function () {
                            return null;
                        });
                        if (!myGroupPayload || !myGroupPayload.data) {
                            continue;
                        }
                        var myGroup = myGroupPayload.data;
                        var groupId = myGroup.id || myGroup.groupId;
                        var stagesPayload = await window.linkseeApi.getJson("/api/v1/assignments/" + encodeURIComponent(assignment.id) + "/stages").catch(function () {
                            return { data: [] };
                        });
                        var stages = Array.isArray(stagesPayload.data) ? stagesPayload.data : [];
                        for (var k = 0; k < stages.length; k++) {
                            var stage = stages[k];
                            var submissionsPayload = await window.linkseeApi.getJson("/api/v1/stages/" + encodeURIComponent(stage.id) + "/groups/" + encodeURIComponent(groupId) + "/submissions").catch(function () {
                                return { data: [] };
                            });
                            var submissions = Array.isArray(submissionsPayload.data) ? submissionsPayload.data : [];
                            var latestSubmission = submissions[0] || null;
                            todoRows.push({
                                course: course,
                                assignment: assignment,
                                group: myGroup,
                                stage: stage,
                                submission: latestSubmission,
                            });
                            var gradePayload = await window.linkseeApi.getJson("/api/v1/stages/" + encodeURIComponent(stage.id) + "/groups/" + encodeURIComponent(groupId) + "/grade").catch(function () {
                                return null;
                            });
                            if (gradePayload && gradePayload.data) {
                                gradeRows.push({
                                    course: course,
                                    assignment: assignment,
                                    group: myGroup,
                                    stage: stage,
                                    grade: gradePayload.data,
                                });
                            }
                        }
                    }
                }

                todoRows.sort(function (a, b) {
                    return new Date(a.stage.dueAt || 0).getTime() - new Date(b.stage.dueAt || 0).getTime();
                });
                gradeRows.sort(function (a, b) {
                    return new Date(b.grade.updatedAt || b.grade.createdAt || 0).getTime() - new Date(a.grade.updatedAt || a.grade.createdAt || 0).getTime();
                });
                var activeTodoRows = todoRows.filter(function (row) {
                    return !isTodoDone(row);
                });

                function isSelectedCourse(row, courseId) {
                    return !courseId || String(row.course && row.course.id) === String(courseId);
                }

                function renderCourseScope(courseId) {
                    var scopedCourses = courseId
                        ? courseRows.filter(function (course) { return String(course.id) === String(courseId); })
                        : courseRows;
                    var scopedTodos = todoRows.filter(function (row) { return isSelectedCourse(row, courseId); });
                    if (courseList) {
                        courseList.innerHTML = scopedCourses.map(function (course) {
                            return '<div class="list-item dashboard-list-item-vertical"><div class="dashboard-split-row"><strong>' + linkseePage.escapeHtml(course.name || "--") + '</strong><span class="badge badge-active">' + linkseePage.escapeHtml(course.status || "--") + '</span></div><div class="muted">课程编号：' + linkseePage.escapeHtml(course.courseNo || course.id || "--") + ' · 学年学期：' + linkseePage.escapeHtml(String(course.academicYear || "--")) + ' / ' + linkseePage.escapeHtml(String(course.semester || "--")) + '</div></div>';
                        }).join("") || '<div class="dashboard-empty-state"><strong>暂无课程</strong><p>当前没有可展示的课程。</p></div>';
                    }
                    if (stageList) {
                        stageList.innerHTML = scopedTodos.map(function (row) {
                            var status = getTodoStatus(row);
                            var dueLabel = row.stage.dueAt ? new Date(row.stage.dueAt).toLocaleDateString("zh-CN") : "--";
                            return '<div class="list-item dashboard-list-item-vertical"><div class="dashboard-split-row"><strong>' + linkseePage.escapeHtml(row.stage.title || ("阶段 " + row.stage.stageNo)) + '</strong><span class="badge badge-pending">' + linkseePage.escapeHtml(status) + '</span></div><div class="muted">课程：' + linkseePage.escapeHtml(row.course.name || "--") + ' · 项目：' + linkseePage.escapeHtml(row.assignment.title || "--") + ' · 截止：' + linkseePage.escapeHtml(dueLabel) + '</div></div>';
                        }).join("") || '<div class="dashboard-empty-state"><strong>暂无项目阶段</strong><p>当前课程没有可展示的阶段。</p></div>';
                    }
                    if (artifactList) {
                        var submittedRows = scopedTodos.filter(function (row) { return row.submission; });
                        artifactList.innerHTML = submittedRows.map(function (row) {
                            var submittedAt = row.submission.submittedAt || row.submission.createdAt;
                            return '<div class="list-item dashboard-list-item-vertical"><div class="dashboard-split-row"><strong>' + linkseePage.escapeHtml(row.stage.title || ("阶段 " + row.stage.stageNo)) + '</strong><span class="badge badge-active">' + linkseePage.escapeHtml(row.submission.status || "--") + '</span></div><div class="muted">课程：' + linkseePage.escapeHtml(row.course.name || "--") + ' · 提交时间：' + linkseePage.escapeHtml(submittedAt ? new Date(submittedAt).toLocaleString("zh-CN", { hour12: false }) : "--") + ' · attempt=' + linkseePage.escapeHtml(String(row.submission.attemptNo || "--")) + '</div></div>';
                        }).join("") || '<div class="dashboard-empty-state"><strong>暂无提交记录</strong><p>当前课程还没有阶段材料记录。</p></div>';
                    }
                }

                renderCourseScope("");
                if (courseScopeSelect) {
                    courseScopeSelect.addEventListener("change", function () {
                        renderCourseScope(courseScopeSelect.value);
                    });
                }

                if (todoCountBadge) {
                    todoCountBadge.textContent = String(activeTodoRows.length);
                    todoCountBadge.hidden = activeTodoRows.length === 0;
                }
                if (todoMemoList) {
                    todoMemoList.innerHTML = activeTodoRows.map(function (row) {
                        var status = getTodoStatus(row);
                        var dueLabel = row.stage.dueAt ? new Date(row.stage.dueAt).toLocaleDateString("zh-CN") : "--";
                        var isOverdue = row.stage.dueAt && new Date(row.stage.dueAt).getTime() < Date.now();
                        return '<article class="student-todo-note' + (isOverdue ? ' is-overdue' : '') + '"><div><strong>' + linkseePage.escapeHtml(row.stage.title || ("阶段 " + row.stage.stageNo)) + '</strong><p>课程：' + linkseePage.escapeHtml(row.course.name || "--") + '</p><p>截止：' + linkseePage.escapeHtml(dueLabel) + ' · 状态：' + linkseePage.escapeHtml(status) + '</p></div><button class="btn btn-secondary student-todo-submit" type="button" data-submit-panel="true">提交</button></article>';
                    }).join("") || '<div class="student-todo-empty"><strong>暂无待办</strong><p>当前没有需要处理的阶段任务。</p></div>';
                    todoMemoList.querySelectorAll("[data-submit-panel]").forEach(function (button) {
                        button.addEventListener("click", function () {
                            var submitNav = document.querySelector('.side-nav .nav-item[data-target="panel-file-submit"]');
                            toggleTodoPopover(false);
                            if (submitNav) {
                                submitNav.click();
                                return;
                            }
                            window.location.href = "./submission-hub.html";
                        });
                    });
                }
                if (gradeList) {
                    gradeList.innerHTML = gradeRows.map(function (row) {
                        var score = row.grade.score === null || row.grade.score === undefined ? "--" : String(row.grade.score);
                        var publishedAt = row.grade.publishedAt || row.grade.updatedAt || row.grade.createdAt;
                        return '<div class="list-item"><div class="list-main"><div class="list-row"><strong>' + linkseePage.escapeHtml(row.stage.title || ("阶段 " + row.stage.stageNo)) + '</strong><span class="chip">分数 ' + linkseePage.escapeHtml(score) + '</span></div><div class="muted">课程：' + linkseePage.escapeHtml(row.course.name || "--") + ' · 发布时间：' + linkseePage.escapeHtml(publishedAt ? new Date(publishedAt).toLocaleString("zh-CN", { hour12: false }) : "--") + '</div></div><span class="badge badge-approved">' + linkseePage.escapeHtml(row.grade.status || "--") + '</span></div>';
                    }).join("");
                }
                if (gradeEmpty) {
                    gradeEmpty.hidden = gradeRows.length > 0;
                }
            } catch (err) {
                if (todoMemoList) {
                    todoMemoList.innerHTML = '<div class="student-todo-empty"><strong>加载失败</strong><p>' + linkseePage.escapeHtml(err.message || "请稍后重试") + '</p></div>';
                }
            }
        })();
    </script>
</body>

</html>

<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 聊天</title>
    <link rel="stylesheet" href="./styles/theme.css" />
    <style>
        .single-window-shell .user-profile {
            margin: 0;
            padding: 0;
            border: 0;
        }

        .single-window-shell .avatar-wrapper {
            width: 88px;
            height: 88px;
        }
    </style>
</head>
<body class="academic-shell centered-page-shell single-window-shell">
<main class="page">
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>聊天</div>
        <div class="top-actions">
            <span id="userBadge" class="user-avatar">ID: --</span>
            <button id="backToDashboard" class="ghost">返回工作台</button>
            <button id="logoutBtn">退出登录</button>
        </div>
    </header>

    <section class="wechat-shell">
        <aside class="wechat-sidebar">
            <div class="profile-pane">
                <div class="user-profile">
                    <input type="file" id="avatarInput" accept="image/*" hidden />
                    <div class="avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                        <img id="avatarImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="头像" />
                        <div class="avatar-overlay">更换</div>
                    </div>
                </div>
                <div class="profile-name">
                    <strong id="profileRealName">未设置昵称</strong>
                    <input id="nicknameInput" placeholder="修改昵称" />
                    <button id="nicknameSaveBtn" class="btn btn-primary">保存昵称</button>
                    <div class="dashboard-soft-note" id="nicknameHint"></div>
                </div>
            </div>
            <div class="wechat-list" id="conversationList"></div>
        </aside>

        <section class="wechat-main">
            <div class="chat-header">
                <div class="chat-title">
                    <strong id="chatTitle">请选择群聊</strong>
                    <span class="muted" id="chatMeta">--</span>
                </div>
                <div class="dashboard-soft-note" id="metaInfo">正在加载登录信息...</div>
            </div>
            <div class="message-stream" id="messageList">
                <div class="wechat-empty">请选择一个群聊开始聊天</div>
            </div>
            <div class="composer">
                <textarea id="messageInput" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
                <div class="action-row">
                    <button id="sendBtn" class="btn btn-primary">发送</button>
                    <button id="markReadBtn" class="btn btn-ghost">标记已读</button>
                </div>
            </div>
        </section>
    </section>
</main>
<script src="./scripts/api-client.js"></script>
<script src="./scripts/page-utils.js"></script>
<script src="./scripts/dashboard-shell.js"></script>
<script>
if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
const auth = linkseePage.getAuth();
const conversationList = document.getElementById("conversationList");
const messageList = document.getElementById("messageList");
const chatTitle = document.getElementById("chatTitle");
const chatMeta = document.getElementById("chatMeta");
const messageInput = document.getElementById("messageInput");
const profileRealName = document.getElementById("profileRealName");
const logoutBtn = document.getElementById("logoutBtn");
const backToDashboard = document.getElementById("backToDashboard");
let currentUser = null;
let rows = [];
let selected = null;
let participantMap = new Map();

document.getElementById("nicknameHint").textContent = "";
initDashboardShell({ avatarStorageKey: "chat_avatar_data_url" });
linkseePage.setSessionMeta(document.getElementById("metaInfo"), document.getElementById("userBadge"));
logoutBtn.onclick = linkseePage.logout;
backToDashboard.onclick = () => linkseePage.go(linkseePage.roleDashboard(auth.role));

function avatarOf(user) {
    return (user && user.profile && user.profile.avatarUrl) || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>";
}
function nameOf(user) {
    return (user && user.profile && user.profile.realName) || user?.id || "未知用户";
}
async function loadMe() {
    const me = await window.linkseeApi.getJson("/api/v1/users/me");
    currentUser = me.data || {};
    profileRealName.textContent = currentUser.profile && currentUser.profile.realName ? currentUser.profile.realName : auth.userId;
    const nicknameInput = document.getElementById("nicknameInput");
    if (nicknameInput) nicknameInput.value = profileRealName.textContent;
    localStorage.setItem("auth_real_name", profileRealName.textContent);
}
async function loadConversations() {
    const payload = await window.linkseeApi.getJson("/api/v1/conversations");
    rows = Array.isArray(payload.data) ? payload.data : [];
    conversationList.innerHTML = rows.map((row) => `
        <div class="conv-item${selected && String(selected.id) === String(row.id) ? " is-active" : ""}" data-id="${row.id}">
            <div class="conv-avatar"><img src="${avatarOf(row.lastMessage && row.lastMessage.sender)}" alt="头像"></div>
            <div class="conv-meta">
                <strong>${linkseePage.escapeHtml(row.title || row.roomKey)}</strong>
                <div class="muted">${linkseePage.escapeHtml(row.lastMessage && row.lastMessage.content ? row.lastMessage.content : "暂无消息")}</div>
            </div>
            <span class="conv-badge">${row.unreadCount || 0}</span>
        </div>`).join("");
    conversationList.querySelectorAll(".conv-item").forEach((el) => {
        el.onclick = () => {
            selected = rows.find((r) => String(r.id) === String(el.dataset.id)) || null;
            renderActive();
            loadMessages();
        };
    });
    if (!selected && rows[0]) selected = rows[0];
    renderActive();
}
async function loadParticipants() {
    participantMap = new Map();
    if (!selected) return;
    const path = selected.scopeType === "group"
        ? `/api/v1/groups/${selected.scopeId}/members`
        : `/api/v1/courses/${selected.scopeId}/members`;
    const payload = await window.linkseeApi.getJson(path);
    const members = Array.isArray(payload.data) ? payload.data : [];
    for (const member of members) {
        const user = member.user || {};
        participantMap.set(
            user.id || member.userId,
            user,
        );
    }
}
async function loadMessages() {
    if (!selected) {
        messageList.innerHTML = '<div class="wechat-empty">请选择一个群聊开始聊天</div>';
        return;
    }
    await loadParticipants();
    const path = selected.scopeType === "group"
        ? `/api/v1/groups/${selected.scopeId}/messages`
        : `/api/v1/courses/${selected.scopeId}/messages`;
    const msg = await window.linkseeApi.getJson(path);
    const messages = Array.isArray(msg.data) ? msg.data : [];
    messageList.innerHTML = messages.map((row) => {
        const me = row.senderId === auth.userId;
        const user = participantMap.get(row.senderId) || { id: row.senderId, profile: { realName: row.senderId, avatarUrl: "" } };
        return `
            <div class="bubble-row ${me ? "me" : ""}">
                ${me ? "" : `<div class="conv-avatar" style="width:40px;height:40px"><img src="${avatarOf(user)}" alt=""></div>`}
                <div class="bubble ${me ? "me" : ""}">
                    <div class="bubble-head">
                        ${me ? "" : `<img src="${avatarOf(user)}" alt="">`}
                        <strong>${linkseePage.escapeHtml(nameOf(user))}</strong>
                        <span class="muted">${new Date(row.createdAt).toLocaleString("zh-CN",{hour12:false})}</span>
                    </div>
                    <div>${linkseePage.escapeHtml(row.content || "")}</div>
                </div>
                ${me ? `<div class="conv-avatar" style="width:40px;height:40px"><img src="${avatarOf(currentUser)}" alt=""></div>` : ""}
            </div>`;
    }).join("");
    chatTitle.textContent = selected.title || selected.roomKey;
    chatMeta.textContent = selected.scopeType === "group" ? `群聊 · ${selected.roomKey}` : `课程群聊 · ${selected.roomKey}`;
}
function renderActive() {
    conversationList.querySelectorAll(".conv-item").forEach((el) => {
        el.classList.toggle("is-active", selected && String(selected.id) === String(el.dataset.id));
    });
}
document.getElementById("sendBtn").onclick = async () => {
    if (!selected || !messageInput.value.trim()) return;
    const path = selected.scopeType === "group"
        ? `/api/v1/groups/${selected.scopeId}/messages`
        : `/api/v1/courses/${selected.scopeId}/messages`;
    await window.linkseeApi.postJson(path, { type: "text", content: messageInput.value.trim() });
    messageInput.value = "";
    await loadConversations();
    await loadMessages();
};
document.getElementById("markReadBtn").onclick = async () => {
    if (!selected || !selected.lastMessage) return;
    await window.linkseeApi.postJson(`/api/v1/conversations/${selected.id}/read`, { messageId: selected.lastMessage.id });
};
    messageInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("sendBtn").click();
    }
});
loadMe()
    .then(loadConversations)
    .then(loadParticipants)
    .then(loadMessages)
    .catch((err) => {
        conversationList.innerHTML = `<div class="dashboard-empty-state"><strong>聊天加载失败</strong><p>${linkseePage.escapeHtml(err.message)}</p></div>`;
    });
</script>
</body>
</html>

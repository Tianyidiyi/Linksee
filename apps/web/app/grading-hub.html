<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 批改台</title>
    <link rel="stylesheet" href="./styles/theme.css" />
</head>
<body>
<main class="page">
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>批改台</div>
        <div class="top-actions">
            <span id="userBadge" class="user-avatar">ID: --</span>
            <a class="icon-btn" href="./chat-hub.html" title="打开课程群聊">聊</a>
            <button id="backToDashboard" class="ghost">返回工作台</button>
            <button id="logoutBtn">退出登录</button>
        </div>
    </header>
    <section class="layout">
        <div class="card">
            <h2 class="card-title">课程与队列</h2>
            <div class="meta" id="metaInfo">正在加载登录信息...</div>
            <select id="courseSelect" class="dashboard-select"></select>
            <div class="list" id="reviewList"></div>
        </div>
        <div class="card">
            <h2 class="card-title">批改面板</h2>
            <div class="dashboard-empty-state" id="reviewContext">请选择左侧提交</div>
            <input id="scoreInput" class="dashboard-input" type="number" min="0" max="100" placeholder="分数" />
            <textarea id="commentInput" class="dashboard-textarea" placeholder="反馈"></textarea>
            <div class="action-grid">
                <button id="startBtn" class="btn btn-ghost">开始评审</button>
                <button id="saveReviewBtn" class="btn">提交评审</button>
                <button id="saveDraftBtn" class="btn btn-ghost">保存草稿</button>
                <button id="publishBtn" class="btn btn-ghost">发布成绩</button>
            </div>
        </div>
    </section>
</main>
<script src="./scripts/api-client.js"></script>
<script src="./scripts/page-utils.js"></script>
<script src="./scripts/dashboard-shell.js"></script>
<script>
if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
const auth = linkseePage.getAuth();
linkseePage.setSessionMeta(document.getElementById("metaInfo"), document.getElementById("userBadge"));
document.getElementById("logoutBtn").onclick = linkseePage.logout;
document.getElementById("backToDashboard").onclick = () => linkseePage.go(linkseePage.roleDashboard(auth.role));
initDashboardShell({ avatarStorageKey: "grading_avatar_data_url" });
let currentCourseId = "";
let currentSubmissionId = "";
let currentGradeId = "";
async function loadCourses() {
    const payload = await window.linkseeApi.getJson("/api/v1/courses");
    const rows = Array.isArray(payload.data) ? payload.data : [];
    const select = document.getElementById("courseSelect");
    select.innerHTML = rows.map((c) => `<option value="${c.id}">${linkseePage.escapeHtml(c.name || c.courseNo || c.id)}</option>`).join("");
    currentCourseId = rows[0] && rows[0].id;
    if (currentCourseId) await loadQueue();
    select.onchange = async () => { currentCourseId = select.value; await loadQueue(); };
}
async function loadQueue() {
    const payload = await window.linkseeApi.getJson(`/api/v1/courses/${currentCourseId}/pending-reviews`);
    const rows = Array.isArray(payload.data) ? payload.data : [];
    document.getElementById("reviewList").innerHTML = rows.map((r) => `<div class="list-item" data-id="${r.id}"><div class="list-main"><div class="list-row"><strong>${linkseePage.escapeHtml(r.stage && r.stage.title || "未命名")}</strong><span class="chip">${linkseePage.escapeHtml(r.group && (r.group.groupNo || r.group.name) || "--")}</span></div><div class="muted">${linkseePage.escapeHtml(r.submittedBy || "--")} · ${new Date(r.submittedAt).toLocaleString("zh-CN",{hour12:false})}</div></div><span class="tag">${r.status}</span></div>`).join("");
    document.querySelectorAll("#reviewList .list-item").forEach((el) => el.onclick = async () => {
        currentSubmissionId = el.dataset.id;
        document.getElementById("reviewContext").textContent = "submission: " + currentSubmissionId;
    });
}
document.getElementById("startBtn").onclick = async () => {
    if (!currentSubmissionId) return;
    await window.linkseeApi.postJson(`/api/v1/submissions/${currentSubmissionId}/reviews/start`, {});
};
document.getElementById("saveReviewBtn").onclick = async () => {
    if (!currentSubmissionId) return;
    await window.linkseeApi.postJson(`/api/v1/submissions/${currentSubmissionId}/reviews`, {
        status: "approved",
        comment: document.getElementById("commentInput").value.trim(),
    });
    await loadQueue();
};
document.getElementById("saveDraftBtn").onclick = async () => {
    if (!currentSubmissionId) return;
    const resp = await window.linkseeApi.postJson(`/api/v1/submissions/${currentSubmissionId}/grade-drafts`, {
        score: Number(document.getElementById("scoreInput").value),
    });
    currentGradeId = resp.data && resp.data.id;
};
document.getElementById("publishBtn").onclick = async () => {
    if (!currentGradeId) return;
    await window.linkseeApi.postJson(`/api/v1/grades/${currentGradeId}/publish`, {});
};
loadCourses();
</script>
</body>
</html>

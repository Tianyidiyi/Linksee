<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 学生小组空间</title>
    <link rel="stylesheet" href="./styles/theme.css" />
</head>

<body>
    <main class="page">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                学生小组空间
            </div>
            <div class="top-actions">
                <span id="userBadge" class="user-avatar">ID: --</span>
                <a class="icon-btn" href="./chat-hub.html" title="打开课程群聊">聊</a>
                <button id="backToDashboard" class="ghost">返回工作台</button>
                <button id="logoutBtn">退出登录</button>
            </div>
        </header>

        <section class="card">
            <h1 class="card-title">原型推进组 · 空间概览 <span class="badge">group:31</span></h1>
            <div class="meta" id="metaInfo">正在加载登录信息...</div>
            <div class="action-grid">
                <select id="courseSelect" class="dashboard-select"></select>
                <select id="assignmentSelect" class="dashboard-select"></select>
            </div>
            <div class="filters">
                <button class="filter-btn is-active" type="button">in_progress</button>
                <button class="filter-btn" type="button">submitted</button>
                <button class="filter-btn" type="button">under_review</button>
                <button class="filter-btn" type="button">approved</button>
            </div>
            <div class="stat-grid">
                <div class="stat">
                    <strong id="stageSummary">--</strong>
                    <span>当前任务阶段</span>
                </div>
                <div class="stat">
                    <strong id="memberCount">0</strong>
                    <span>小组成员</span>
                </div>
                <div class="stat">
                    <strong id="taskCount">0</strong>
                    <span>待完成任务</span>
                </div>
            </div>
        </section>

        <section class="layout">
            <div class="card">
                <h2 class="card-title">阶段进度 <span class="badge">assignment_stages</span></h2>
                <div class="flow" id="stageFlow"></div>
                <div class="list" id="stageList"></div>
            </div>

            <div class="card">
                <h2 class="card-title">小任务清单 <span class="badge">mini_tasks</span></h2>
                <div class="list" id="taskList"></div>
            </div>

            <div class="card">
                <h2 class="card-title">讨论记录 <span class="badge">discussion</span></h2>
                <div class="list" id="messagePreview"></div>
            </div>

            <div class="card">
                <h2 class="card-title">文件与仓库 <span class="badge">artifacts</span></h2>
                <div class="list" id="artifactList"></div>
            </div>

            <div class="card">
                <h2 class="card-title">提交入口 <span class="badge">submission</span></h2>
                <div class="action-grid">
                    <a class="btn" href="./submission-hub.html">进入提交台</a>
                    <a class="btn btn-ghost" href="./student-dashboard.html">返回学习概览</a>
                </div>
            </div>
        </section>
    </main>

    <script src="./scripts/api-client.js"></script>
    <script src="./scripts/page-utils.js"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        const auth = linkseePage.getAuth();
        linkseePage.setSessionMeta(document.getElementById("metaInfo"), document.getElementById("userBadge"));
        document.getElementById("logoutBtn").onclick = linkseePage.logout;
        document.getElementById("backToDashboard").onclick = () => linkseePage.go(linkseePage.roleDashboard(auth.role));

        const courseSelect = document.getElementById("courseSelect");
        const assignmentSelect = document.getElementById("assignmentSelect");
        const stageFlow = document.getElementById("stageFlow");
        const stageList = document.getElementById("stageList");
        const taskList = document.getElementById("taskList");
        const messagePreview = document.getElementById("messagePreview");
        const artifactList = document.getElementById("artifactList");
        const stageSummary = document.getElementById("stageSummary");
        const memberCount = document.getElementById("memberCount");
        const taskCount = document.getElementById("taskCount");
        let currentAssignment = null;
        let currentGroup = null;

        function renderList(list, rows, emptyTitle) {
            if (!rows.length) {
                list.innerHTML = `<div class="dashboard-empty-state"><strong>${emptyTitle}</strong><p>暂无数据</p></div>`;
                return;
            }
            list.innerHTML = rows;
        }

        async function loadAssignments(courseId) {
            const payload = await window.linkseeApi.getJson(`/api/v1/courses/${courseId}/assignments`);
            const rows = Array.isArray(payload.data) ? payload.data : [];
            assignmentSelect.innerHTML = rows.map((a) => `<option value="${a.id}">${linkseePage.escapeHtml(a.title || a.id)}</option>`).join("");
            currentAssignment = rows[0] || null;
            if (currentAssignment) {
                assignmentSelect.value = currentAssignment.id;
                await loadGroupAndStages();
            }
        }

        async function loadGroupAndStages() {
            if (!currentAssignment) return;
            const [groupPayload, stagePayload] = await Promise.all([
                window.linkseeApi.getJson(`/api/v1/assignments/${currentAssignment.id}/my-group`),
                window.linkseeApi.getJson(`/api/v1/assignments/${currentAssignment.id}/stages`),
            ]);
            currentGroup = groupPayload.data || null;
            const stages = Array.isArray(stagePayload.data) ? stagePayload.data : [];
            stageSummary.textContent = stages[0] ? `阶段 ${stages[0].stageNo}` : "--";
            taskCount.textContent = String((currentGroup && currentGroup.miniTaskStats && currentGroup.miniTaskStats.overdue) || stages.length);
            stageFlow.innerHTML = stages.map((stage) => `<span>${linkseePage.escapeHtml(stage.title || `阶段 ${stage.stageNo}`)}</span>`).join("");
            stageList.innerHTML = stages.map((stage) => `<div class="list-item"><div class="list-main"><div class="list-row"><strong>${linkseePage.escapeHtml(stage.title || `阶段 ${stage.stageNo}`)}</strong><span class="chip">stage_no=${stage.stageNo}</span></div><div class="muted">status=${linkseePage.escapeHtml(stage.status || "--")} · due_at=${stage.dueAt ? new Date(stage.dueAt).toLocaleDateString("zh-CN") : "--"}</div></div><span class="tag">${linkseePage.escapeHtml(stage.status || "--")}</span></div>`).join("");
            const groupId = currentGroup && currentGroup.group && currentGroup.group.id ? currentGroup.group.id : (currentGroup && currentGroup.id);
            if (groupId) {
                const [groupDetailPayload, membersPayload, messagesPayload] = await Promise.all([
                    window.linkseeApi.getJson(`/api/v1/groups/${groupId}`),
                    window.linkseeApi.getJson(`/api/v1/groups/${groupId}/members`),
                    window.linkseeApi.getJson(`/api/v1/groups/${groupId}/messages`),
                ]);
                const groupDetail = groupDetailPayload.data || {};
                const members = Array.isArray(membersPayload.data) ? membersPayload.data : [];
                memberCount.textContent = String((groupDetail.members && groupDetail.members.length) || members.length);
                taskList.innerHTML = members.map((m) => `<div class="list-item"><div class="list-main"><div class="list-row"><strong>${linkseePage.escapeHtml(m.userId)}</strong><span class="chip">${linkseePage.escapeHtml(m.role)}</span></div><div class="muted">${linkseePage.escapeHtml(m.user && m.user.profile && m.user.profile.realName || "--")}</div></div></div>`).join("");
                const msgs = Array.isArray(messagesPayload.data) ? messagesPayload.data.slice(0, 2) : [];
                messagePreview.innerHTML = msgs.map((m) => `<div class="list-item"><div class="list-main"><div class="list-row"><strong>${linkseePage.escapeHtml(m.senderId)}</strong><span class="chip">${new Date(m.createdAt).toLocaleString("zh-CN",{hour12:false})}</span></div><div class="muted">${linkseePage.escapeHtml(m.content || "")}</div></div></div>`).join("");
                artifactList.innerHTML = `<div class="list-item"><div class="list-main"><div class="list-row"><strong>小组 ${linkseePage.escapeHtml(currentGroup.group ? (currentGroup.group.groupNo || currentGroup.group.name) : "--")}</strong><span class="chip">groupId=${linkseePage.escapeHtml(groupId)}</span></div><div class="muted">courseId=${linkseePage.escapeHtml(currentGroup.group && currentGroup.group.courseId || "--")}</div></div></div>`;
            }
        }

        async function loadCourses() {
            const payload = await window.linkseeApi.getJson("/api/v1/courses");
            const courses = Array.isArray(payload.data) ? payload.data : [];
            courseSelect.innerHTML = courses.map((course) => `<option value="${course.id}">${linkseePage.escapeHtml(course.name || course.courseNo || course.id)}</option>`).join("");
            if (courses[0]) {
                courseSelect.value = courses[0].id;
                await loadAssignments(courses[0].id);
            }
        }

        courseSelect.onchange = async () => loadAssignments(courseSelect.value);
        assignmentSelect.onchange = async () => {
            currentAssignment = { id: assignmentSelect.value };
            await loadGroupAndStages();
        };
        loadCourses().catch((err) => {
            stageList.innerHTML = `<div class="dashboard-empty-state"><strong>加载失败</strong><p>${linkseePage.escapeHtml(err.message)}</p></div>`;
        });
    </script>
</body>

</html>

<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 助教检查台</title>
    <link rel="stylesheet" href="./styles/theme.css" />
</head>
<body class="app-shell academic-shell assistant-shell">
    <div class="sidebar-trigger" aria-hidden="true"></div>
    <aside class="sidebar">
        <div class="user-profile">
            <input type="file" id="avatarInput" accept="image/*" hidden />
            <div class="avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                <img id="avatarImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>" alt="用户头像" />
                <div class="avatar-overlay">更换</div>
            </div>
            <div id="userBadge">ID: --</div>
        </div>
        <nav class="side-nav" aria-label="助教功能导航">
            <button class="nav-item is-active" data-target="panel-overview" type="button">工作概览</button>
            <button class="nav-item" data-target="panel-queue" type="button">待检查队列</button>
            <button class="nav-item" data-target="panel-history" type="button">处理记录</button>
        </nav>
        <div class="sidebar-actions">
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button">退出登录</button>
        </div>
    </aside>
    <div class="workspace">
        <div class="content-container">
            <div class="page-panel is-active" id="panel-overview">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h1 class="card-title">助教检查台 <span class="badge badge-active">assistant</span></h1>
                        <p>把缺失、复核和已处理任务放在一个视图里，优先处理会阻塞学生提交的项目。</p>
                    </div>
                    <div class="meta" id="metaInfo">正在加载登录信息...</div>
                    <div class="stat-grid">
                        <div class="stat"><strong id="missingCount">0</strong><span>材料缺失</span></div>
                        <div class="stat"><strong id="reviewCount">0</strong><span>需复核提交</span></div>
                        <div class="stat"><strong id="processedCount">0</strong><span>已处理</span></div>
                    </div>
                </section>
            </div>
            <div class="page-panel" id="panel-queue">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">待检查队列</h2>
                        <p>按课程和阶段查看当前待处理提交，保留最短操作路径。</p>
                    </div>
                    <div class="dashboard-filter-bar">
                        <div class="dashboard-filter-meta" id="queueSummary">正在加载队列...</div>
                        <span class="dashboard-soft-note">优先处理缺失与复核项</span>
                    </div>
                    <div class="list" id="assistantQueueList"></div>
                    <div class="dashboard-empty-state" id="assistantQueueEmpty" hidden>
                        <strong>暂无待检查任务</strong>
                        <p>当前课程没有需要处理的提交。</p>
                    </div>
                </section>
            </div>
            <div class="page-panel" id="panel-history">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">处理记录</h2>
                        <p>记录最近处理过的提交状态，便于追踪缺失补充和复核结果。</p>
                    </div>
                    <div class="list" id="assistantHistoryList"></div>
                    <div class="dashboard-empty-state" id="assistantHistoryEmpty" hidden>
                        <strong>暂无处理记录</strong>
                        <p>当前没有可展示的历史条目。</p>
                    </div>
                </section>
            </div>
        </div>
    </div>
    <script src="./scripts/api-client.js"></script>
    <script src="./scripts/page-utils.js"></script>
    <script src="./scripts/dashboard-shell.js"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        initDashboardShell({ avatarStorageKey: "assistant_avatar_data_url" });
        const auth = linkseePage.getAuth();
        const queueList = document.getElementById("assistantQueueList");
        const queueEmpty = document.getElementById("assistantQueueEmpty");
        const historyList = document.getElementById("assistantHistoryList");
        const historyEmpty = document.getElementById("assistantHistoryEmpty");
        const queueSummary = document.getElementById("queueSummary");
        const missingCount = document.getElementById("missingCount");
        const reviewCount = document.getElementById("reviewCount");
        const processedCount = document.getElementById("processedCount");
        linkseePage.setSessionMeta(document.getElementById("metaInfo"), document.getElementById("userBadge"));
        document.getElementById("logoutBtn").onclick = linkseePage.logout;
        function pickStatus(review) {
            return (review && (review.status || review.reviewStatus || review.submissionStatus || "submitted")).toLowerCase();
        }
        function pickTitle(review) {
            return (review && review.stage && review.stage.title) || (review && review.title) || "未命名提交";
        }
        function pickGroup(review) {
            var group = review && (review.group || review.submission && review.submission.group) || {};
            return group.groupNo || group.name || review.groupId || "--";
        }
        function formatDate(value) {
            if (!value) return "--";
            var date = new Date(value);
            return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("zh-CN", { hour12: false });
        }
        function renderCounts(rows) {
            var missing = rows.filter((row) => pickStatus(row) === "missing").length;
            var review = rows.filter((row) => pickStatus(row).indexOf("review") !== -1 || pickStatus(row) === "needs_review").length;
            var processed = rows.filter((row) => pickStatus(row) === "processed" || pickStatus(row) === "approved").length;
            missingCount.textContent = String(missing);
            reviewCount.textContent = String(review);
            processedCount.textContent = String(processed);
        }
        async function loadQueue() {
            if (!window.linkseeApi) return;
            try {
                const coursesPayload = await window.linkseeApi.getJson("/api/v1/courses");
                const courses = Array.isArray(coursesPayload.data) ? coursesPayload.data : [];
                const rows = [];
                for (const course of courses.slice(0, 6)) {
                    const reviewsPayload = await window.linkseeApi.getJson(`/api/v1/courses/${course.id}/pending-reviews`);
                    const reviews = Array.isArray(reviewsPayload.data) ? reviewsPayload.data : [];
                    reviews.forEach((review) => rows.push(Object.assign({ courseName: course.name || course.courseNo || course.id }, review)));
                }
                renderCounts(rows);
                queueSummary.textContent = `当前共 ${rows.length} 条待检查任务`;
                queueList.innerHTML = rows.map((row) => `
                    <div class="list-item dashboard-list-item-vertical">
                        <div class="list-main">
                            <div class="list-row">
                                <strong>${linkseePage.escapeHtml(pickTitle(row))}</strong>
                                <span class="chip">${linkseePage.escapeHtml(row.courseName || "--")}</span>
                            </div>
                            <div class="muted">状态：${linkseePage.escapeHtml(pickStatus(row))} · 小组：${linkseePage.escapeHtml(pickGroup(row))} · 提交时间：${linkseePage.escapeHtml(formatDate(row.submittedAt || row.createdAt))}</div>
                        </div>
                        <span class="badge badge-pending">待处理</span>
                    </div>`).join("");
                queueEmpty.hidden = rows.length > 0;
                historyList.innerHTML = rows.slice(0, 6).map((row) => `
                    <div class="list-item dashboard-list-item-vertical">
                        <div class="list-main">
                            <div class="list-row">
                                <strong>${linkseePage.escapeHtml(pickTitle(row))}</strong>
                                <span class="chip">${linkseePage.escapeHtml(pickStatus(row))}</span>
                            </div>
                            <div class="muted">课程：${linkseePage.escapeHtml(row.courseName || "--")} · 时间：${linkseePage.escapeHtml(formatDate(row.submittedAt || row.createdAt))}</div>
                        </div>
                        <span class="badge badge-submitted">${linkseePage.escapeHtml(pickStatus(row))}</span>
                    </div>`).join("");
                historyEmpty.hidden = rows.length > 0;
            } catch (err) {
                queueSummary.textContent = err.message || "加载失败";
                queueList.innerHTML = "";
                queueEmpty.hidden = false;
                queueEmpty.querySelector("p").textContent = err.message || "加载失败";
            }
        }
        loadQueue();
    </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 教务工作台</title>
    <link rel="stylesheet" href="./styles/theme.css?v=20260602c" />
</head>

<body class="app-shell academic-shell">

    <aside class="sidebar">
        <div class="sidebar-brand" aria-label="Linksee">
            <span class="sidebar-brand-mark" aria-hidden="true">L</span>
            <span class="sidebar-brand-text">Linksee</span>
        </div>
        <nav class="side-nav" aria-label="教务功能导航">
            <button class="nav-item is-active" data-target="panel-courses" type="button" title="课程">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5l9-4 9 4-9 4-9-4z"></path><path d="M21 10.5v7l-9 4-9-4v-7"></path><path d="M12 10.5v11"></path></svg>
                </span>
                <span class="nav-item-label">课程</span>
            </button>
            <button class="nav-item" data-target="panel-assignments" type="button" title="监控">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 14l4-4 3 3 4-6"></path></svg>
                </span>
                <span class="nav-item-label">监控</span>
            </button>
            <button class="nav-item" data-target="panel-course-staff" type="button" title="教师">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3"></circle><path d="M2 20c0-3.2 2.6-5.8 5.8-5.8h2.4c3.2 0 5.8 2.6 5.8 5.8"></path><path d="M17 11h5"></path><path d="M19.5 8.5v5"></path></svg>
                </span>
                <span class="nav-item-label">教师</span>
            </button>
        </nav>
        <div class="sidebar-actions">
            <button id="userSettingsBtn" class="nav-item nav-item-ghost" data-action="open-settings" type="button" title="设置">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.8-3.6 5-5.4 8-5.4S18.2 16.4 20 20"></path></svg>
                </span>
                <span class="nav-item-label">设置</span>
            </button>
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button" title="退出登录">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"></path><path d="M20 12H9"></path><path d="M11 20H6a2 2 0 01-2-2V6a2 2 0 012-2h5"></path></svg>
                </span>
                <span class="nav-item-label">退出</span>
            </button>
        </div>
    </aside>

    <div class="workspace">
        <header class="topbar dashboard-topbar">
            <div class="topbar-left"></div>
            <div class="top-actions top-actions-staff">
                <div class="top-actions-primary" aria-label="快捷操作">
                    <button class="icon-btn" type="button" data-chat-launcher aria-label="消息">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 10h10"></path>
                            <path d="M7 14h6"></path>
                            <path d="M21 12c0 4.42-3.58 8-8 8a8.84 8.84 0 0 1-3.4-.67L3 21l1.67-6.6A8.84 8.84 0 0 1 4 11c0-4.42 3.58-8 8-8s9 4.58 9 9z"></path>
                        </svg>
                        <span class="linksee-chat-dot"></span>
                    </button>
                </div>
                <div class="user-profile user-profile-inline top-actions-profile">
                    <input type="file" id="avatarInput" accept="image/*" hidden />
                    <div class="avatar-wrapper topbar-avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                        <img class="topbar-avatar-image" id="avatarImage"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                            alt="用户头像" />
                        <div class="avatar-overlay">更换</div>
                    </div>
                    <div id="userBadge">ID: --</div>
                </div>
            </div>
        </header>
        <div class="content-container">
            <div class="page-panel is-active" id="panel-courses">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">课程管理</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-merged-section academic-course-manage-section">
                            <div class="academic-toolbar">
                                <input type="text" id="academicCourseSearch" placeholder="搜索课程名称或 ID..." />
                                <select id="academicCourseStatusFilter">
                                    <option>全部状态</option>
                                    <option>进行中</option>
                                    <option>草稿</option>
                                    <option>已存档</option>
                                </select>
                            </div>
                            <div class="dashboard-filter-bar">
                                <div class="dashboard-filter-meta" id="academicCourseMeta">
                                    <span>正在加载课程...</span>
                                </div>
                                <span class="dashboard-soft-note" id="academicCourseNote">等待接口响应</span>
                            </div>
                            <div class="data-grid" id="academicCourseList">
                                <div class="data-grid-header muted academic-table-header">
                                    <span>课程 ID</span>
                                    <span>课程名称</span>
                                    <span>负责人</span>
                                    <span>状态</span>
                                    <span>操作</span>
                                </div>
                            </div>
                            <div class="dashboard-empty-state" id="academicCourseEmpty" hidden>
                                <strong>暂无课程</strong>
                                <p>当前筛选条件下没有课程记录。</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="page-panel" id="panel-assignments">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">全校项目监控</h2>
                    </div>
                    <div class="dashboard-filter-bar">
                        <div class="dashboard-filter-meta" id="academicMonitorMeta">
                            <span>正在加载项目监控...</span>
                        </div>
                        <span class="dashboard-soft-note" id="academicMonitorNote">基于课程 pipeline-health 实时统计</span>
                    </div>
                    <div class="config-stack" id="academicMonitorList"></div>
                    <div class="dashboard-empty-state" id="academicMonitorEmpty" hidden>
                        <strong>暂无监控项</strong>
                        <p>当前课程下没有阶段流水线数据。</p>
                    </div>
                </section>
            </div>

            <div class="page-panel" id="panel-course-editor">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">课程编辑</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-inline-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">选择课程</h3>
                                <select id="academicEditCourseSelect" class="dashboard-select"></select>
                                <span class="dashboard-subcard-note" id="academicEditCourseHint"></span>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">当前状态</h3>
                                <div class="dashboard-filter-bar">
                                    <div class="dashboard-filter-meta" id="academicEditCourseMeta">
                                        <span>等待选择课程</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="dashboard-subcard">
                            <h3 class="dashboard-subcard-title">编辑表单</h3>
                            <div class="single-window-form">
                                <input id="academicEditCourseNo" class="dashboard-input" placeholder="课程编号" disabled />
                                <input id="academicEditCourseName" class="dashboard-input" placeholder="课程名称" />
                                <textarea id="academicEditCourseDescription" class="dashboard-textarea" placeholder="课程简介"></textarea>
                                <select id="academicEditCourseStatus" class="dashboard-select">
                                    <option value="draft">草稿</option>
                                    <option value="active">进行中</option>
                                    <option value="archived">已存档</option>
                                </select>
                                <div class="dashboard-panel-actions">
                                    <button id="academicEditSubmitBtn" class="btn btn-primary" type="button">保存课程修改</button>
                                    <button id="academicEditResetBtn" class="btn btn-secondary" type="button">恢复当前值</button>
                                </div>
                                <div class="dashboard-empty-state" id="academicEditResult" hidden></div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="page-panel" id="panel-course-staff">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">教师配置</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-inline-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">选择课程</h3>
                                <select id="academicStaffCourseSelect" class="dashboard-select"></select>
                                <span class="dashboard-subcard-note" id="academicStaffCourseHint"></span>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">新增教师绑定</h3>
                                <div class="single-window-form">
                                    <input id="academicStaffTeacherId" class="dashboard-input" placeholder="教师用户 ID，例如 2023000001" />
                                    <select id="academicStaffTeacherRole" class="dashboard-select">
                                        <option value="lead">主讲教师</option>
                                        <option value="co">协同教师</option>
                                    </select>
                                    <button id="academicStaffAddTeacherBtn" class="btn btn-primary" type="button">添加教师到课程</button>
                                </div>
                            </div>
                        </div>

                        <div class="dashboard-inline-grid dashboard-split-scroll-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">当前教师</h3>
                                <div class="list dashboard-scroll-region" id="academicStaffTeacherList"></div>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">当前助教</h3>
                                <div class="list dashboard-scroll-region" id="academicStaffAssistantList"></div>
                            </div>
                        </div>

                        <div class="dashboard-empty-state" id="academicStaffResult" hidden></div>
                    </div>
                </section>
            </div>

            <div class="page-panel" id="panel-account-batch">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">账号开通</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-subcard">
                            <h3 class="dashboard-subcard-title">默认密码</h3>
                            <input id="academicBatchDefaultPassword" class="dashboard-input" placeholder="可选：留空则自动生成临时密码" />
                        </div>
                        <div class="dashboard-inline-grid dashboard-split-scroll-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">批量创建学生</h3>
                                <textarea id="academicBatchStudents" class="dashboard-textarea" placeholder="2023010001,张三,2023010001,2023,2023,软件工程,软工2301"></textarea>
                                <div class="dashboard-panel-actions">
                                    <button id="academicBatchStudentSubmitBtn" class="btn btn-primary" type="button">创建学生账号</button>
                                    <button id="academicBatchStudentClearBtn" class="btn btn-secondary" type="button">清空学生数据</button>
                                </div>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">批量创建教师</h3>
                                <textarea id="academicBatchTeachers" class="dashboard-textarea" placeholder="2023000001,李老师,2023000001,教授,计算机学院,软件工程教育"></textarea>
                                <div class="dashboard-panel-actions">
                                    <button id="academicBatchTeacherSubmitBtn" class="btn btn-primary" type="button">创建教师账号</button>
                                    <button id="academicBatchTeacherClearBtn" class="btn btn-secondary" type="button">清空教师数据</button>
                                </div>
                            </div>
                        </div>
                        <div class="dashboard-empty-state" id="academicBatchResult" hidden></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./scripts/api-client.js?v=20260602b"></script>
    <script src="./scripts/page-utils.js?v=20260602b"></script>
    <script src="./scripts/dashboard-extensions.js?v=20260602b"></script>
    <script src="./scripts/dashboard-shell.js?v=20260602b"></script>
    <script src="./scripts/user-settings.js?v=20260602b"></script>
    <script src="./scripts/leaf-pile.js?v=20260602b"></script>
    <script src="./scripts/academic-dashboard.js?v=20260602b"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        initDashboardShell({
            avatarStorageKey: "academic_avatar_data_url",
        });
        initAcademicDashboard();
    </script>
</body>

</html>

<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 教师工作台</title>
    <link rel="stylesheet" href="./styles/theme.css?v=20260603c" />
</head>

<body class="app-shell teacher-shell academic-shell">

    <aside class="sidebar">
        <div class="sidebar-brand" aria-label="Linksee">
            <span class="sidebar-brand-mark" aria-hidden="true">L</span>
            <span class="sidebar-brand-text">Linksee</span>
        </div>
        <nav class="side-nav" aria-label="教师功能导航">
            <button class="nav-item" data-target="panel-course-manage" type="button" title="课程管理">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16"></path><path d="M4 12h16"></path><path d="M4 17.5h10"></path><path d="M18 16v4"></path><path d="M16 18h4"></path></svg>
                </span>
                <span class="nav-item-label">课程管理</span>
            </button>
            <button class="nav-item is-active" data-target="panel-review-workbench" type="button" title="批阅">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16"></path><path d="M7 17V9"></path><path d="M12 17V5"></path><path d="M17 17v-3"></path></svg>
                </span>
                <span class="nav-item-label">批阅</span>
            </button>
        </nav>
        <div class="sidebar-actions">
            <button id="userSettingsBtn" class="nav-item nav-item-ghost" data-action="open-settings" type="button" title="设置">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.8-3.6 5-5.4 8-5.4S18.2 16.4 20 20"></path></svg>
                </span>
                <span class="nav-item-label">设置</span>
            </button>
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button" title="退出登录">
                <span class="nav-item-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17l5-5-5-5"></path><path d="M20 12H9"></path><path d="M11 20H6a2 2 0 01-2-2V6a2 2 0 012-2h5"></path></svg>
                </span>
                <span class="nav-item-label">退出</span>
            </button>
        </div>
    </aside>

    <div class="workspace">
        <header class="topbar dashboard-topbar">
            <div class="topbar-left"></div>
            <div class="top-actions top-actions-staff">
                <div class="top-actions-primary" aria-label="快捷操作">
                    <button class="icon-btn" type="button" data-chat-launcher aria-label="消息">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 10h10"></path>
                            <path d="M7 14h6"></path>
                            <path d="M21 12c0 4.42-3.58 8-8 8a8.84 8.84 0 0 1-3.4-.67L3 21l1.67-6.6A8.84 8.84 0 0 1 4 11c0-4.42 3.58-8 8-8s9 4.58 9 9z"></path>
                        </svg>
                        <span class="linksee-chat-dot"></span>
                    </button>
                </div>
                <div class="user-profile user-profile-inline top-actions-profile">
                    <input type="file" id="avatarInput" accept="image/*" hidden />
                    <div class="avatar-wrapper topbar-avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                        <img class="topbar-avatar-image" id="avatarImage"
                            src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                            alt="用户头像" />
                        <div class="avatar-overlay">更换</div>
                    </div>
                    <div id="userBadge">ID: --</div>
                </div>
            </div>
        </header>
        <div class="content-container">
            <div class="page-panel is-active" id="panel-review-workbench">
                <section class="card teacher-review-workbench-card teacher-review-unified-card">
                    <div class="dashboard-toolbar-row teacher-review-toolbar">
                        <div class="dashboard-section-intro">
                            <h2 class="card-title dashboard-title-reset">批阅工作台</h2>
                        </div>
                        <div class="teacher-review-filter-grid">
                            <select class="dashboard-select" id="teacherCourseSelect">
                                <option value="">加载课程中...</option>
                            </select>
                            <select class="dashboard-select" id="teacherAssignmentSelect">
                                <option value="">选择项目</option>
                            </select>
                            <select class="dashboard-select" id="teacherStageSelect">
                                <option value="">全部阶段</option>
                            </select>
                            <button id="teacherReloadBtn" class="teacher-review-refresh-btn" type="button" aria-label="刷新" title="刷新">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M20 11a8 8 0 1 0 2.2 5.5"></path>
                                    <path d="M20 4v7h-7"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="dashboard-card-body">
                        <div class="teacher-review-workbench">
                            <section class="dashboard-subcard teacher-review-queue">
                                <div class="teacher-review-panel-head">
                                    <h3 class="dashboard-subcard-title">提交队列</h3>
                                    <div class="teacher-review-panel-metrics">
                                        <span id="teacherPendingCount">待批阅</span>
                                    </div>
                                </div>
                                <div class="list" id="teacherReviewList"></div>
                                <div class="teacher-review-queue-footer">
                                    <button id="teacherQueuePrev" class="teacher-review-page-btn" type="button" aria-label="上一页">‹</button>
                                    <span id="teacherQueuePage" class="teacher-review-page-indicator">1 / 1</span>
                                    <button id="teacherQueueNext" class="teacher-review-page-btn" type="button" aria-label="下一页">›</button>
                                    <span id="teacherQueueSize" class="teacher-review-page-size">6 组/页</span>
                                </div>
                            </section>

                            <section class="teacher-review-editor">
                                <div class="teacher-review-editor-top">
                                    <div class="dashboard-subcard teacher-review-selected-card">
                                        <div class="teacher-review-selected-head">
                                            <div>
                                                <strong id="teacherSelectedTitle">提交内容</strong>
                                                <div id="teacherSelectedPath" class="teacher-review-selected-path">课程 / 项目 / 阶段</div>
                                            </div>
                                        </div>
                                        <div id="selectedReviewContext" class="teacher-review-inline-meta"></div>
                                    </div>

                                    <div class="dashboard-subcard teacher-review-detail-card">
                                        <h3 class="dashboard-subcard-title">提交内容</h3>
                                        <div id="teacherSubmissionDetail" class="teacher-review-detail-list">
                                            <div class="teacher-review-detail-layout">
                                                <div class="teacher-review-detail-main">
                                                    <div class="teacher-review-detail-item"><span class="teacher-review-detail-label">提交标题</span><div class="teacher-review-richtext"><span class="teacher-review-empty-text">暂无信息</span></div></div>
                                                    <div class="teacher-review-detail-item"><span class="teacher-review-detail-label">成果说明</span><div class="teacher-review-richtext"><span class="teacher-review-empty-text">暂无信息</span></div></div>
                                                    <div class="teacher-review-detail-item"><span class="teacher-review-detail-label">贡献说明</span><div class="teacher-review-richtext"><span class="teacher-review-empty-text">暂无信息</span></div></div>
                                                    <div class="teacher-review-detail-item"><span class="teacher-review-detail-label">仓库链接</span><div class="teacher-review-richtext"><span class="teacher-review-empty-text">暂无信息</span></div></div>
                                                    <div class="teacher-review-detail-item"><span class="teacher-review-detail-label">参考链接</span><div class="teacher-review-richtext"><span class="teacher-review-empty-text">暂无信息</span></div></div>
                                                </div>
                                                <aside class="teacher-review-file-card">
                                                    <div class="teacher-review-file-head"><span>附件列表</span><span>暂无附件</span></div>
                                                    <div class="teacher-review-file-list">
                                                        <div class="teacher-review-file-empty">文件类型：<span class="teacher-review-empty-text">暂无信息</span><br>文件名：<span class="teacher-review-empty-text">暂无信息</span></div>
                                                    </div>
                                                </aside>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="dashboard-inline-grid teacher-review-lower-grid">
                                    <div class="dashboard-subcard teacher-review-action-card">
                                        <h3 class="dashboard-subcard-title">批阅与评分</h3>
                                        <label class="user-settings-field">
                                            <span>结论</span>
                                            <select id="teacherReviewStatus" class="dashboard-select">
                                                <option value="approved">通过</option>
                                                <option value="needs_changes">退回修改</option>
                                                <option value="rejected">拒绝</option>
                                            </select>
                                        </label>
                                        <label class="user-settings-field">
                                            <span>批阅意见</span>
                                            <textarea id="gradeFeedbackInput" class="dashboard-textarea" placeholder="输入批阅意见"></textarea>
                                        </label>
                                        <label class="user-settings-field">
                                            <span>分数 (0-100)</span>
                                            <input id="gradeScoreInput" class="dashboard-input" type="number" placeholder="输入最终分数" min="0" max="100">
                                        </label>
                                        <div class="dashboard-panel-actions teacher-review-action-row">
                                            <button id="startReviewBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>开始评审</button>
                                            <button id="saveReviewBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>提交批阅</button>
                                            <button id="saveDraftBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>保存分数草稿</button>
                                            <button id="publishGradeBtn" class="btn btn-primary academic-btn-block" type="button" disabled>确定并发布成绩</button>
                                        </div>
                                    </div>

                                    <div class="dashboard-subcard teacher-review-history-card">
                                        <div class="teacher-review-panel-head">
                                            <h3 class="dashboard-subcard-title">历次提交</h3>
                                            <span class="dashboard-filter-tag" id="teacherAttemptCount">0 次</span>
                                        </div>
                                        <div id="teacherAttemptList" class="teacher-review-attempt-list">
                                            <div class="teacher-review-placeholder">暂无记录</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="dashboard-empty-state" id="teacherActionResult" hidden></div>
                            </section>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./scripts/api-client.js?v=20260602b"></script>
    <script src="./scripts/page-utils.js?v=20260602b"></script>
    <script src="./scripts/dashboard-extensions.js?v=20260617a"></script>
    <script src="./scripts/dashboard-shell.js?v=20260603w"></script>
    <script src="./scripts/user-settings.js?v=20260602b"></script>
    <script src="./scripts/leaf-pile.js?v=20260602b"></script>
    <script src="./scripts/teacher-dashboard.js?v=20260618b"></script>
    <script>
        if (!linkseePage.requireAuth()) { throw new Error("auth required"); }
        initDashboardShell({
            avatarStorageKey: "teacher_avatar_data_url",
        });
        initTeacherDashboard();
    </script>
</body>

</html>

<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linksee 教师工作台</title>
    <link rel="stylesheet" href="./styles/theme.css" />
</head>

<body class="app-shell teacher-shell academic-shell">

    <div class="sidebar-trigger" aria-hidden="true"></div>
    <aside class="sidebar">
        <div class="user-profile">
            <input type="file" id="avatarInput" accept="image/*" hidden />
            <div class="avatar-wrapper" id="avatarWrapper" title="点击更换头像">
                <img id="avatarImage"
                    src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239CA3AF'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>"
                    alt="用户头像" />
                <div class="avatar-overlay">更换</div>
            </div>
            <div id="userBadge">ID: --</div>
        </div>

        <nav class="side-nav" aria-label="教师功能导航">
            <button class="nav-item is-active" data-target="panel-review-workbench" type="button">批阅工作台</button>
        </nav>
        <div class="sidebar-actions">
            <button id="userSettingsBtn" class="nav-item nav-item-ghost" type="button">用户设置</button>
            <button id="logoutBtn" class="nav-item nav-item-logout" type="button">退出登录</button>
        </div>
    </aside>

    <div class="workspace">
        <div class="content-container">
            <div class="page-panel is-active" id="panel-review-workbench">
                <section class="card teacher-review-workbench-card">
                    <div class="dashboard-toolbar-row">
                        <div class="dashboard-section-intro">
                            <h2 class="card-title dashboard-title-reset">批阅队列 <span
                                    class="badge badge-reviewing">批阅</span></h2>
                        </div>
                        <select class="dashboard-select" id="teacherCourseSelect">
                            <option value="">加载课程中...</option>
                        </select>
                        <select class="dashboard-select" id="teacherQueueSort">
                            <option value="oldest">按提交时间排序 (最早)</option>
                            <option value="latest">按提交时间排序 (最新)</option>
                        </select>
                    </div>

                    <div class="dashboard-card-body">
                        <div class="list dashboard-list-offset" id="teacherReviewList"></div>
                        <div class="dashboard-empty-state" id="teacherReviewEmpty" hidden>
                            <strong>暂无待批改提交</strong>
                            <p>当前课程没有待处理提交。</p>
                        </div>
                        <div class="dashboard-filter-bar">
                            <div class="dashboard-filter-meta" id="teacherReviewMeta"><span>正在加载队列...</span></div>
                            <span class="dashboard-soft-note">点击条目可切换下方批改上下文</span>
                        </div>
                    </div>
                </section>
            </div>

            <div class="page-panel" id="panel-review-detail-source">
                <section class="card">
                    <div class="dashboard-section-intro">
                        <h2 class="card-title">批阅详情</h2>
                    </div>
                    <div class="dashboard-card-body">
                        <div class="dashboard-subcard">
                            <div class="review-item dashboard-list-item-static">
                                <div class="review-meta">
                                    <strong>请选择待批改提交</strong>
                                    <span class="muted">这里会展示当前评审上下文</span>
                                    <a id="selectedReviewAttachment" class="dashboard-inline-link">查看完整附件
                                        ↗</a>
                                </div>
                            </div>
                        </div>

                        <div class="dashboard-inline-grid dashboard-split-scroll-grid">
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">批改输入</h3>
                                <div class="nav-section dashboard-section-md">
                                    <div class="nav-section-title dashboard-section-sm">打分 (0-100)</div>
                                    <input id="gradeScoreInput" class="dashboard-input" type="number" placeholder="输入分数" min="0" max="100">
                                </div>
                                <div class="nav-section dashboard-section-lg">
                                    <div class="nav-section-title dashboard-section-sm">批改反馈意见</div>
                                    <textarea id="gradeFeedbackInput" class="dashboard-textarea" placeholder="请输入建设性的反馈意见，指出优点与不足..."></textarea>
                                </div>
                            </div>
                            <div class="dashboard-subcard">
                                <h3 class="dashboard-subcard-title">当前待批改上下文</h3>
                                <div class="list"><div id="selectedReviewContext" class="muted">请选择左侧提交。</div></div>
                            </div>
                        </div>

                        <div class="dashboard-panel-actions">
                            <button id="startReviewBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>开始评审</button>
                            <button id="saveDraftBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>保存草稿</button>
                            <button id="saveReviewBtn" class="btn btn-primary academic-btn-block" type="button" disabled>确认通过 ✓</button>
                            <button id="publishGradeBtn" class="btn btn-secondary academic-btn-block" type="button" disabled>发布成绩</button>
                        </div>
                        <div class="dashboard-empty-state" id="teacherActionResult" hidden></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script src="./scripts/api-client.js"></script>
    <script src="./scripts/dashboard-extensions.js"></script>
    <script src="./scripts/dashboard-shell.js"></script>
    <script src="./scripts/user-settings.js"></script>
    <script src="./scripts/leaf-pile.js"></script>
    <script src="./scripts/teacher-dashboard.js"></script>
    <script>
        function mergeTeacherReviewWorkbench() {
            var workbench = document.getElementById("panel-review-workbench");
            var grading = document.getElementById("panel-review-detail-source");
            if (!workbench) return;

            var body = workbench.querySelector(".dashboard-card-body");
            if (!body || body.querySelector(".teacher-review-workbench")) {
                if (grading) grading.remove();
                return;
            }

            var toolbar = workbench.querySelector(".dashboard-toolbar-row");
            var gradingBody = grading ? grading.querySelector(".dashboard-card-body") : null;
            var layout = document.createElement("div");
            var queue = document.createElement("section");
            var editor = document.createElement("section");

            layout.className = "teacher-review-workbench";
            queue.className = "dashboard-subcard teacher-review-queue";
            editor.className = "teacher-review-editor";

            if (toolbar) {
                queue.appendChild(toolbar);
            }
            while (body.firstChild) {
                queue.appendChild(body.firstChild);
            }
            if (gradingBody) {
                while (gradingBody.firstChild) {
                    editor.appendChild(gradingBody.firstChild);
                }
            }

            layout.appendChild(queue);
            layout.appendChild(editor);
            body.appendChild(layout);
            if (grading) grading.remove();
        }

        mergeTeacherReviewWorkbench();
        initDashboardShell({
            avatarStorageKey: "teacher_avatar_data_url",
        });
        document.querySelectorAll("[data-panel-link]").forEach(function (button) {
            button.addEventListener("click", function () {
                var targetId = button.getAttribute("data-panel-link");
                var sideNavButton = document.querySelector('.side-nav .nav-item[data-target="' + targetId + '"]');
                if (sideNavButton) {
                    sideNavButton.click();
                }
            });
        });
        initTeacherDashboard();
    </script>
</body>

</html>
